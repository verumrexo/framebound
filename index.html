<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; base-uri 'none'; object-src 'none'; frame-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' data: blob:; connect-src 'self' http: https: ws: wss:;">
  <link rel="icon" type="image/png" href="/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>framebound:uplink</title>
  <style>
    @font-face {
      font-family: 'Press Start 2P';
      src: url('/fonts/PressStart2P-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    body {
      margin: 0;
      background: #000;
      overflow: hidden;
      font-family: 'Press Start 2P', cursive;
      text-transform: lowercase;
      image-rendering: pixelated;
    }

    canvas {
      display: block;
      image-rendering: pixelated;
      /* Standard */
      image-rendering: crisp-edges;
      /* Firefox */
    }

    /* Scanlines Overlay */
    #scanlines {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0) 50%, rgba(0, 0, 0, 0.2) 50%, rgba(0, 0, 0, 0.2));
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 9000;
      opacity: 0.6;
      display: none;
    }

    /* Vignette Overlay */
    #vignette {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(0, 0, 0, 0) 60%, rgba(0, 0, 0, 0.8) 100%);
      pointer-events: none;
      z-index: 9001;
      display: none;
    }
  </style>
</head>

<body style="margin: 0; padding: 0; overflow: hidden; background-color: #000; user-select: none;">
  <div id="app"></div>
  <div id="scanlines"></div>
  <div id="vignette"></div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
