name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SIGNALING_URL: ${{ vars.VITE_SIGNALING_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          
      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Critical coverage gate
        run: npm run test:coverage:critical

      - name: Check release version
        run: npm run check:version

      - name: Check runtime import graph
        run: npm run audit:imports

      - name: Check source hygiene
        run: npm run check:source

      - name: Lint
        run: npm run lint

      - name: Check typed boundaries
        run: npm run typecheck

      - name: Audit runtime dependencies
        run: npm run audit:dependencies

      - name: Build
        run: npm run build
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
