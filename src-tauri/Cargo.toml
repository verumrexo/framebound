[package]
name = "framebound"
version = "1.2.0-beta"
description = "Framebound desktop shell"
authors = ["Framebound contributors"]
edition = "2021"

[features]
default = []
part-lab = []

[lints.rust]
warnings = "deny"

[lib]
name = "framebound_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
